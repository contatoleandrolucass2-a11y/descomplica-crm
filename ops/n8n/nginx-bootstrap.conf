server {
    listen 80;
    listen [::]:80;
    server_name n8n-crm.descomplicapro.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Owner setup remains available only through the private SSH tunnel.
    location / {
        default_type text/plain;
        return 503 "Configuracao administrativa pendente.\n";
    }
}
