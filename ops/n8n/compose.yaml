name: descomplica-n8n-crm

x-defaults: &defaults
  restart: unless-stopped
  pull_policy: never
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *defaults
    image: ${POSTGRES_IMAGE:?Run prepare.mjs first}
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 128
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing private env}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    <<: *defaults
    image: ${N8N_IMAGE:?Run prepare.mjs first}
    mem_limit: 1g
    cpus: "1.00"
    pids_limit: 256
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Missing private env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Missing private env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Missing private env}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [database, runners, outbound]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5678/healthz/readiness', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  runner:
    <<: *defaults
    image: ${RUNNERS_IMAGE:?Run prepare.mjs first}
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 128
    cap_drop: [ALL]
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Missing private env}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    networks: [runners]
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  postgres_data:
    name: descomplica-n8n-crm-postgres-data
  n8n_data:
    name: descomplica-n8n-crm-n8n-data

networks:
  database:
    name: descomplica-n8n-crm-database
    internal: true
  runners:
    name: descomplica-n8n-crm-runners
    internal: true
  outbound:
    name: descomplica-n8n-crm-outbound
