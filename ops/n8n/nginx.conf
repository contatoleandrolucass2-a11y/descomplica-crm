map $http_upgrade $n8n_crm_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n-crm.descomplicapro.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://n8n-crm.descomplicapro.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n-crm.descomplicapro.com.br;
    ssl_certificate /etc/letsencrypt/live/n8n-crm.descomplicapro.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n-crm.descomplicapro.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 16m;

    # Owner setup must never be reopened through the public proxy.
    location = /rest/owner/setup { return 403; }
    location ^~ /rest/owner/setup/ { return 403; }

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host n8n-crm.descomplicapro.com.br;
        proxy_set_header X-Forwarded-Host n8n-crm.descomplicapro.com.br;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $n8n_crm_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
