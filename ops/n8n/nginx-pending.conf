server {
    listen 80;
    listen [::]:80;
    server_name n8n-crm.descomplicapro.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://n8n-crm.descomplicapro.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n-crm.descomplicapro.com.br;
    ssl_certificate /etc/letsencrypt/live/n8n-crm.descomplicapro.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n-crm.descomplicapro.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    # Do not expose an unclaimed n8n owner account to the internet.
    location / {
        default_type text/plain;
        return 503 "Configuracao administrativa pendente.\n";
    }
}
