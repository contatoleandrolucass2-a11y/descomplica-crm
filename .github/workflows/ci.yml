name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify current documentation fee sources
        run: pnpm documentation:verify-sources

      - name: Audit high and critical vulnerabilities
        run: pnpm audit --audit-level high

      - name: Validate inventory compression with isolated Nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends nginx
          node scripts/qa/nginx-inventory-transfer.mjs

      - name: Build
        run: pnpm build

  release-gates:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Associative page guide with synthetic inventory
        run: node scripts/qa/reference-parity.mjs associative-page-guide

      - name: Start isolated local Supabase
        shell: bash
        run: |
          start_log="$(mktemp "${RUNNER_TEMP}/supabase-start.XXXXXX")"
          if pnpm db:start >"${start_log}" 2>&1; then
            rm -f "${start_log}"
            echo "Local Supabase started."
          else
            start_status=$?
            rm -f "${start_log}"
            echo "::error::Local Supabase failed to start; raw CLI output was withheld."
            exit "${start_status}"
          fi

      - name: Replay migrations without seed
        run: pnpm exec supabase db reset --local --no-seed

      - name: Database tests
        run: pnpm db:test

      - name: Database lint and advisors
        run: |
          pnpm exec supabase db lint --local --level warning --fail-on warning
          pnpm exec supabase db advisors --local --type security --level warn --fail-on warn
          pnpm exec supabase db advisors --local --type performance --level warn --fail-on warn

      - name: Production build
        run: pnpm build

      - name: Browser authorization and release E2E
        run: pnpm qa:e2e:release

      - name: Responsive, theme, zoom and keyboard matrix
        run: pnpm qa:visual:authenticated
        env:
          QA_ALLOW_MISSING_PRIVATE_INVENTORY: "true"

      - name: Upload sanitized visual candidate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-visual-candidate-${{ github.sha }}
          path: |
            test-results/authenticated-visual
            test-results/associative-page-guide
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  isolated-restore:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rehearse clean migration and logical restore
        run: >-
          pnpm db:rehearse
          --evidence docs/release-candidate/ci-isolated-restore-results.json

      - name: Upload sanitized restore evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-restore-${{ github.sha }}
          path: docs/release-candidate/ci-isolated-restore-results.json
          if-no-files-found: error
          retention-days: 14

  promotable-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build immutable image outside production
        run: node scripts/release/build-promotable-image.mjs

      - name: Prove both runtime profiles with synthetic secrets
        run: sudo --preserve-env=IMAGE_TAG "$(command -v node)" scripts/release/prove-promotable-image.mjs

      - name: Export release artifact
        run: |
          mkdir -p "${RUNNER_TEMP}/crm-release"
          docker image inspect --format '{{.Id}}' "descomplica-crm:${IMAGE_TAG}" > "${RUNNER_TEMP}/crm-release/image-id.txt"
          printf '%s\n' "${IMAGE_TAG}" > "${RUNNER_TEMP}/crm-release/revision.txt"
          docker save "descomplica-crm:${IMAGE_TAG}" | gzip -1 > "${RUNNER_TEMP}/crm-release/image.tar.gz"
          cd "${RUNNER_TEMP}/crm-release"
          sha256sum image.tar.gz > image.sha256

      - name: Upload verified image without deployment credentials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotable-image-${{ github.sha }}
          path: ${{ runner.temp }}/crm-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
