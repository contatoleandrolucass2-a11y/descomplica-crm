<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#071a31" />
    <meta
      name="description"
      content="Acompanhe o investimento, as campanhas e o custo por lead das suas contas de anúncios com metas e diagnóstico por campanha e anúncio. Descomplica Ads."
    />
    <title>Descomplica Ads · Visão geral</title>
    <link rel="icon" href="/descomplica-ads/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/descomplica-ads/style.css" />
    <script type="module" src="/descomplica-ads/app.mjs"></script>
  </head>
  <body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </symbol>
        <symbol id="i-megaphone" viewBox="0 0 24 24">
          <path d="m3 10 16-6v16L3 14zM3 10v4M7 16l2 5h3l-2-4M22 9v6" />
        </symbol>
        <symbol id="i-wallet" viewBox="0 0 24 24">
          <path d="M20 7H5a2 2 0 0 1 0-4h13v4M3 5v14a2 2 0 0 0 2 2h15V7M20 12h-5v5h5" />
          <path d="M17 14.5h.01" />
        </symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 15l4-5 4 2 5-7" /></symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
          <path d="M14 3H5v18h14V8zM14 3v6h5M8 13h8M8 17h5" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path
            d="m10 14 4-4M8 16l-2 2a4 4 0 0 1-5-6l4-4a4 4 0 0 1 6 0M16 8l2-2a4 4 0 0 1 5 6l-4 4a4 4 0 0 1-6 0"
            transform="translate(1 0) scale(.9 1)"
          />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" /></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5" /></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 15 5-5 4 3 5-8m-6 0h6v6" /></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="m5 9 5 5 4-3 5 8m-6 0h6v-6" /></symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
          <path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5" />
        </symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="3" />
          <path d="M7 3v4m10-4v4M3 11h18m-13 4h.01m4 0h.01m4 0h.01" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="i-target" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="5" />
          <circle cx="12" cy="12" r="1" />
        </symbol>
        <symbol id="i-mouse" viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-3 7z" /></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v6m0-10h.01" />
        </symbol>
        <symbol id="i-bell" viewBox="0 0 24 24">
          <path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10M10 21h4" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12" />
        </symbol>
        <symbol id="i-half" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 3v18m0-18a9 9 0 0 1 0 18z" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2zM12 9v5m0 3h.01" /></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path d="m9 3-1 3-3 1v4l-2 1 2 4 3 1 1 4h6l1-4 3-1 2-4-2-1V7l-3-1-1-3z" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-meta" viewBox="0 0 24 24">
          <path d="M3 16c-3-9 3-15 8-6l4 7c4 7 9-2 5-9-4-7-8 3-10 7-6 10-8 1-7 1" />
        </symbol>
      </defs>
    </svg>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <main id="main" class="main-shell" tabindex="-1">
      <div class="dashboard-toolbar">
        <button class="nav-item dashboard-alert" id="alerts-button" aria-label="Ver alertas">
          <svg class="icon"><use href="#i-bell" /></svg><span>Alertas</span
          ><span class="notification-dot" id="notification-dot"></span>
        </button>
      </div>
      <div class="breadcrumb">
        <span>MARKETING</span><span class="breadcrumb-slash">/</span
        ><span class="breadcrumb-current">META ADS</span
        ><span class="workspace-label"
          ><svg class="icon"><use href="#i-meta" /></svg> Facebook & Instagram</span
        >
      </div>
      <section class="page-heading">
        <div>
          <div class="title-line">
            <h1 id="page-title">Visão geral de anúncios</h1>
            <span id="data-badge" class="badge badge-demo"
              ><span class="dot"></span>Demonstração</span
            >
          </div>
          <p id="page-description">Do investimento ao lead: encontre o ponto que merece atenção.</p>
        </div>
        <div class="heading-actions">
          <button class="button secondary" id="import-button">
            <svg class="icon"><use href="#i-upload" /></svg>Importar dados</button
          ><button class="button primary" id="export-button">
            <svg class="icon"><use href="#i-download" /></svg>Exportar relatório
          </button>
        </div>
      </section>
      <section class="filter-bar" aria-label="Filtros do dashboard">
        <div class="filter-group">
          <label for="account-filter">Conta de anúncios</label>
          <div class="select-wrap">
            <svg class="icon"><use href="#i-wallet" /></svg
            ><select id="account-filter">
              <option value="all">Todas as contas</option></select
            ><svg class="icon chevron"><use href="#i-chevron" /></svg>
          </div>
        </div>
        <div class="filter-group period-group">
          <label for="period-filter">Período de análise</label>
          <div class="select-wrap">
            <svg class="icon"><use href="#i-calendar" /></svg
            ><select id="period-filter">
              <option value="month">Este mês</option>
              <option value="7">Últimos 7 dias</option>
              <option value="14">Últimos 14 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="previous">Mês anterior</option>
              <option value="all">Todo o período</option>
              <option value="custom">Personalizado</option></select
            ><svg class="icon chevron"><use href="#i-chevron" /></svg>
          </div>
        </div>
        <div class="filter-group status-group">
          <label for="status-filter">Status da veiculação</label>
          <div class="select-wrap">
            <span class="status-filter-dot"></span
            ><select id="status-filter">
              <option value="all">Todos os status</option>
              <option value="active">Ativas</option>
              <option value="paused">Pausadas</option>
              <option value="unknown">Não informado / outros</option></select
            ><svg class="icon chevron"><use href="#i-chevron" /></svg>
          </div>
        </div>
        <button
          id="reset-filters"
          class="icon-button reset-button"
          title="Limpar filtros"
          aria-label="Limpar filtros"
        >
          <svg class="icon"><use href="#i-refresh" /></svg>
        </button>
        <div class="filter-divider"></div>
        <div class="data-state">
          <span id="source-status"><span class="dot"></span>Dados de exemplo</span
          ><small id="date-caption">01 a 16 de outubro de 2026</small>
        </div>
        <button class="text-button connection-shortcut" id="connections-button">
          <svg class="icon"><use href="#i-link" /></svg><span>Integrações</span
          ><svg class="icon tiny"><use href="#i-arrow" /></svg>
        </button>
      </section>
      <div id="active-filter-summary" class="active-filter-summary" hidden></div>
      <div id="page-content"></div>
      <footer class="footer">
        <span
          >Descomplica<span class="footer-ads">ADS</span
          ><span class="footer-separator">·</span>Clareza para decidir. Dados para crescer.</span
        ><span id="footer-source">Ambiente de demonstração · BRL (R$)</span>
      </footer>
    </main>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="csv-input" type="file" accept=".csv,text/csv,text/plain" hidden />
  </body>
</html>
