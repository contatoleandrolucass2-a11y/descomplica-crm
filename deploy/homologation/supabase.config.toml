# Runtime exclusivo de homologação. Copiado para diretório root-only pelo runbook.
project_id = "descomplica-homologation"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 10
max_client_conn = 50

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false
port = 55324

[storage]
enabled = false
file_size_limit = "1MiB"

[storage.s3_protocol]
enabled = false

[auth]
enabled = true
site_url = "https://homolog.descomplicapro.com.br"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 1
sms_sent = 1
anonymous_users = 1
token_refresh = 60
sign_in_sign_ups = 120
token_verifications = 300
web3 = 1

[auth.email]
# Mantém login por e-mail ativo; [auth].enable_signup=false continua bloqueando
# criação pública de contas no Auth isolado.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "1m"

[auth.mfa]
max_enrolled_factors = 2

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "1m"

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 55883
deno_version = 2

[analytics]
enabled = false
port = 55327
backend = "postgres"
