server {
    listen 80;
    listen [::]:80;
    server_name crm.descomplicapro.com.br;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # A aplicacao permanece inacessivel por HTTP ate o certificado existir.
    location / {
        add_header Retry-After 3600 always;
        return 503;
    }
}

