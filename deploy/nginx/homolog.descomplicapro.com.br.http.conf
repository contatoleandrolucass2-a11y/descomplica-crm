server {
    listen 80;
    listen [::]:80;
    server_name homolog.descomplicapro.com.br;

    access_log /var/log/nginx/homolog.descomplicapro.com.br.access.log;
    error_log /var/log/nginx/homolog.descomplicapro.com.br.error.log;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # A homologacao permanece inacessivel por HTTP ate o certificado existir.
    location = /auth/callback {
        access_log off;
        error_log /dev/null crit;
        add_header Retry-After 3600 always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 503;
    }

    location / {
        add_header Retry-After 3600 always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 503;
    }
}
